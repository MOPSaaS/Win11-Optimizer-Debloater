name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Parse + PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse all PowerShell files
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors -and $errors.Count -gt 0) {
                  Write-Host "::error file=$($_.FullName)::Parse errors:"
                  $errors | ForEach-Object { Write-Host "  $_" }
                  $bad++
              } else {
                  Write-Host "OK  $($_.FullName)"
              }
          }
          if ($bad -gt 0) { exit 1 }

      - name: Validate XAML
        shell: pwsh
        run: |
          Add-Type -AssemblyName PresentationFramework
          [xml]$x = Get-Content MainWindow.xaml -Raw
          $reader = New-Object System.Xml.XmlNodeReader $x
          $w = [Windows.Markup.XamlReader]::Load($reader)
          if (-not $w) { exit 1 }
          Write-Host "XAML OK: $($w.Title)"

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,PSUseApprovedVerbs
          if ($results) {
              $results | Format-Table -AutoSize
              $errors = $results | Where-Object Severity -eq 'Error'
              if ($errors) { exit 1 }
          } else {
              Write-Host "PSScriptAnalyzer: clean."
          }
